# 2D-SRBA-OOOO VAE sweep arm ep150 (2026-10-24): the SRBA baseline VAE
# (finetune_vae_jupiter_srba_baseline_256res.yaml, see its header) with one change:
#   epochs 300 -> 150 (~975 optimizer steps), visualization at 75/150
# Paired with train_dit_jupiter_srba_ep150.yaml (baseline DiT recipe on these latents).
# Launch: bash jobs/jupiter/submit_srba_sweep.sh

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false
  checkpoint: null
  channels: ["pressure", "velocityX", "velocityY", "log_density"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  data_root: "/e/project1/e-dev-2026d09-262/neptuna_datasets/2D_SRBA_OOOO/256x256/train.h5"
  dataset: "srba"
  channel_order: ["pressure", "velocityX", "velocityY", "log_density"]
  normalization_stats_file: "configs/finetune_vae/srba_256_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: 97  # 8*12+1, no padding
  eval_sims: 24
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  min_learning_rate: 1e-6
  scheduler_type: "cosine"
  epochs: 150
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.0
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  epochs: [75, 150]  # mid-training and final; replaces interval_epochs
  num_samples: 3      # Mach min / median / max of the val split
  frame_numbers: [25, 50, 75, 97]
  dpi: 150
  save_video: true   # + GT/Prediction/Residual MP4 over all frames per sample

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse_chmean"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "cosine", "20ep", "srba", "jupiter", "ep150", "s44", "rmse-h1", "256res", "eval24", "f97"]

seed: 44
output_dir: "finetune_vae_jupiter_srba_ep150_256res"
clean_output_dir: true
