# Temporal subsampling, stride 2 (2026-10-24): the baseline VAE recipe
# (finetune_vae_jupiter_baseline_s44_256res) on every 2nd stored frame,
# 0, 2, ..., 96 -- 49 frames over the same physical span as the baseline's 97.
# Changes: data.frame_stride 2, data.num_sim_frames 97 -> 49 (8*6+1, no
# padding), visualization frames to the same physical times, output_dir, tags.
#
# Step 1, no training (bash jobs/jupiter/submit_stride2_vae_check.sh): the
# baseline VAE's checkpoint evaluated on test.h5 through this config, i.e. on
# stride-2 sequences. LTX compresses 8 frames into one latent, so at stride 2
# each latent spans 16 stored frames; if the reconstruction gets clearly worse
# than the baseline's own 0.0799 (all-frames ch-mean), the VAE cannot take the
# larger frame-to-frame change and stride 2 is not worth a DiT run.
# Step 2, only if step 1 holds up: train this config as a full pipeline.

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  data_root: "/dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/256x256_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_256_only_train.yaml"
  normalization_clip: 5.0
  frame_stride: 2
  num_sim_frames: 49  # 8*6+1, no padding; stored frames 0..96 (see header)
  eval_sims: 500
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  min_learning_rate: 1e-6
  scheduler_type: "cosine"
  epochs: 20
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.0
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  epochs: [10, 20]   # mid-training and final; replaces interval_epochs
  num_samples: 3     # gamma min / median / max of the val split
  frame_numbers: [13, 25, 37, 49]  # stored frames 24, 48, 72, 96
  dpi: 150
  save_video: true   # + GT/Prediction/Residual MP4 over all frames per sample

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse_chmean"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "cosine", "20ep", "shockwave-cfd", "jupiter", "baseline", "stability", "s44", "rmse-h1", "256res", "eval500", "stride2", "f49"]

seed: 44
output_dir: "finetune_vae_jupiter_baseline_s44_stride2_256res"
clean_output_dir: true
