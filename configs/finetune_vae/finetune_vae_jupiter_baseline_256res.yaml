# Jupiter baseline VAE -- reference point for the post-thesis experiments.
#
# Identical to the thesis baseline (finetune_vae_ch6_loss_rmse_h1_256res.yaml,
# Ch6 "Full FT": whole encoder + decoder, 1.0*RMSE + 50*H1, AdamW LR 5e-5,
# 200 warm-up steps, cosine to 1e-6, 20 epochs, effective batch 32, seed 42);
# only output_dir, the wandb tags and the visualization schedule (PNGs + MP4s at
# epochs 10 and 20 instead of PNGs every 4 epochs) differ. A separate run name keeps it from
# colliding with the 2026-09-26 jupiter run of the thesis config (job 2028911),
# whose output_dir already holds .train_complete.
#
# data_root below is sng_pvc's path; on jupiter, patch_config_for_cluster
# replaces it with CLUSTER_DEFAULTS["jupiter"]["data_root"].
#
# Launch (jupiter, whole VAE -> eval -> encode -> DiT -> eval chain):
#   bash jobs/jupiter/submit_baseline_pipeline.sh

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  data_root: "/dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/256x256_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_256_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 500
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  min_learning_rate: 1e-6
  scheduler_type: "cosine"
  epochs: 20
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.0
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  epochs: [10, 20]   # mid-training and final; replaces interval_epochs
  num_samples: 3     # gamma min / median / max of the val split
  frame_numbers: [25, 50, 75, 100]
  dpi: 150
  save_video: true   # + GT/Prediction/Residual MP4 over all frames per sample

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "cosine", "20ep", "shockwave-cfd", "jupiter", "baseline", "rmse-h1", "256res", "eval500"]

seed: 42
output_dir: "finetune_vae_jupiter_baseline_256res"
clean_output_dir: true
