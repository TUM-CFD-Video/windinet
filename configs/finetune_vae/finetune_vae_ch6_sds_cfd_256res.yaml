# Chapter 6, Group 5 (KL/SDS Compatibility Mitigation) -- "SDS_CFD" arm.
#
# Fixed across all of Group 5: Group 1-3's winner (full-structure FT,
# assumed RMSE+H1 @ 5e-5, cosine) -- see finetune_vae_ch6_kl_1e7_256res
# .yaml for the full group rationale. Same 256res data, eval_sims=500,
# epochs=20, seed=42.
#
# THIS ARM vs finetune_vae_ch6_loss_rmse_h1_256res.yaml: adds the "sds" loss
# term with `sds.dit_checkpoint` pointing at an ALREADY-finetuned-on-this-
# project's-own-CFD-latents DiT checkpoint (the sibling arm to
# finetune_vae_ch6_sds_stock_256res.yaml's stock/untrained teacher -- see
# that file's header for the precise "stock" vs "CFD" distinction, which
# must be stated exactly).
#
# CHECK BEFORE SUBMITTING: dit_checkpoint below reuses this project's
# existing best-known DiT checkpoint (shockwave_dit_ep20_baseline, step
# 09360 -- the same checkpoint the pre-Chapter-6 256res SDS arms
# distill from, see finetune_vae_whole_structure_baseline_ep20_256res_sds
# _w0p0001.yaml). CONFIRM the file still exists at this path (`ls` it) on
# whichever cluster this launches on before submitting -- this checkpoint
# was trained under the OLD (pre-Chapter-6) eval_sims=675 split, but that
# is fine here: this checkpoint only acts as a frozen, already-converged
# critic evaluating THIS run's own freshly-encoded latents at each step
# (see SdsLossConfig's docstring formula) -- its own training split has no
# bearing on its validity as a critic, unlike a checkpoint being directly
# reused as a preprocessed-latent source (where a split mismatch WOULD
# matter). If this exact path is stale by the time Group 5 actually
# launches, point at whatever the current best DiT checkpoint is instead
# (any real, converged, CFD-finetuned run is a valid "SDS_CFD" teacher --
# it does not need to be Chapter 6's own DiT, which does not exist yet at
# this point in the campaign; that would be circular in the other
# direction).
#
# WEIGHT: 0.1, matching the sibling SDS_stock arm exactly -- Group 5 is a
# teacher-identity comparison at a FIXED weight, not a weight sweep.
#
# Launch (sng_pvc):
#   sbatch jobs/sng_pvc/finetune_vae.sbatch \
#       configs/finetune_vae/finetune_vae_ch6_sds_cfd_256res.yaml \
#       "${SCRATCH}/windinet/euler_mq_dataset/256x256_ds/train.h5"

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  data_root: "/dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/256x256_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_256_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 500
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  min_learning_rate: 1e-6
  scheduler_type: "cosine"
  epochs: 20
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.0  # SSIM dropped from the Chapter 6 baseline (2026-09-25)
    mlw: 0.0
    # THE variable vs finetune_vae_ch6_loss_rmse_h1_256res.yaml.
    sds: 0.1

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

sds:
  enabled: true
  model_source: "LTXV_2B_0.9.6_DEV"
  # Literal resolved path (not "$SCRATCH/...", does not get expanded) --
  # see header CHECK BEFORE SUBMITTING note.
  dit_checkpoint: "/hppfs/scratch/0D/go76fuz2/windinet/outputs/shockwave_dit_ep20_baseline/checkpoints/model_weights_step_09360.safetensors"
  scalar_conditioning:
    enabled: true
    scalar_names: ["gamma"]
    scalar_ranges:
      gamma: [1.0, 2.0]
    embedding_dim: 4096
    num_tokens_per_scalar: 4
    fourier_features: 64
    mlp_hidden_dim: 256
    dropout: 0.1
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

visualization:
  enabled: true
  interval_epochs: 4
  num_samples: 3
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "cosine", "20ep", "shockwave-cfd", "chapter6", "sds", "sds-cfd", "256res", "eval500"]

seed: 42
output_dir: "finetune_vae_ch6_sds_cfd_256res"
clean_output_dir: true
