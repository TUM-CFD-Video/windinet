# KL sweep with the per-element KL (2026-10-09), weight 1e-3.
# finetune_vae_jupiter_baseline_s44_256res.yaml (test ch-mean 0.0799) plus
# loss_weighting.weights.kl: 1.0e-3; output_dir and tags. KL(q(z|x) || N(0, I))
# is now averaged over latent elements (windinet/losses/kl_divergence.py); the
# collapsed finetune_vae_jupiter_kl_* arms summed it, so their 1e-7 equals ~1e-2
# here. The stock posterior sits at ~7.05 nats per element (baseline s44 train_kl
# 7.5e5 / 106496), so 1e-5 / 1e-4 / 1e-3 put the KL term at ~0.1% / 1.2% / 12% of
# the baseline's epoch-1 total loss (0.057), ~0.5% / 5% / 50% of its epoch-20 one
# (0.014). The old 1e-7 sum was ~130% at epoch 1.
# Training decodes z = mu + sigma * eps whenever kl > 0; validation, test eval and
# DiT preprocessing use the posterior mean.
# Launch: bash jobs/jupiter/submit_klmean.sh

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  data_root: "/dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/256x256_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_256_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: 97  # 8*12+1, no padding (see header)
  eval_sims: 500
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  min_learning_rate: 1e-6
  scheduler_type: "cosine"
  epochs: 20
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.0
    mlw: 0.0
    kl: 1.0e-3

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  epochs: [10, 20]   # mid-training and final; replaces interval_epochs
  num_samples: 3     # gamma min / median / max of the val split
  frame_numbers: [25, 50, 75, 97]
  dpi: 150
  save_video: true   # + GT/Prediction/Residual MP4 over all frames per sample

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "cosine", "20ep", "shockwave-cfd", "jupiter", "klmean1e-3", "s44", "rmse-h1", "256res", "eval500", "f97"]

seed: 44
output_dir: "finetune_vae_jupiter_klmean_1e3_s44_256res"
clean_output_dir: true
