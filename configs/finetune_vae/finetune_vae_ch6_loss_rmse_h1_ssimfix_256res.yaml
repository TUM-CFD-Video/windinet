# Chapter 6, Group 2 (VAE Loss Ablation) -- "RMSE+H1+SSIM (fixed SSIM)" arm.
#
# SINGLE VARIABLE vs finetune_vae_ch6_loss_rmse_h1_256res.yaml (the Chapter 6
# baseline since 2026-09-25):
#   loss_weighting.weights.ssim: 0.0 -> 0.15
#
# Why this arm exists: the original SSIM arms (full_ft, loss_rmse_ssim)
# trained with the pre-fix SSIM loss, whose luminance term broke on our
# signed [-1,1] fields (fixed in commit dd5302c: shift to [0,1], valid
# window; verified against Wang et al. 2004's reference implementation).
# The baseline dropped SSIM for time reasons. This arm answers "does the
# CORRECT SSIM help?" as SSIM on vs off at otherwise identical settings.
# It is VAE-only: compare E_VAE (val_vrmse_chmean plus per-channel) against
# loss_rmse_h1, plus a qualitative look at the shock regions in the
# validation panels (what SSIM is actually meant to improve).
#
# Must run on a checkout that contains commit dd5302c. Everything else
# (LR 5e-5, cosine, 20 epochs, eval_sims=500, seed=42, full-structure FT) is
# identical to the baseline.
#
# Launch (sng_pvc):
#   sbatch jobs/sng_pvc/finetune_vae.sbatch \
#       configs/finetune_vae/finetune_vae_ch6_loss_rmse_h1_ssimfix_256res.yaml \
#       "${SCRATCH}/windinet/euler_mq_dataset/256x256_ds/train.h5"
# or via jobs/sng_pvc/ch6_submit.sh vae loss_rmse_h1_ssimfix

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  # Placeholder -- overridden at launch by jobs/<cluster>/*.sbatch's
  # data_root argument/cluster default. Only meaningful if this config is
  # ever run through a launcher that does NOT override data_root.
  data_root: "/dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/256x256_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_256_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 500
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  min_learning_rate: 1e-6
  scheduler_type: "cosine"
  epochs: 20
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.15  # THE variable vs finetune_vae_ch6_loss_rmse_h1_256res.yaml (ssim 0.0)
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 4
  num_samples: 3
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "cosine", "20ep", "shockwave-cfd", "chapter6", "loss-ablation", "rmse-h1-ssim", "ssim-fixed", "256res", "eval500"]

seed: 42
output_dir: "finetune_vae_ch6_loss_rmse_h1_ssimfix_256res"
clean_output_dir: true
