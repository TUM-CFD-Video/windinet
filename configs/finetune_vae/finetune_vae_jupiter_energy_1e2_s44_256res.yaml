# Total-energy loss (2026-11-12, Harish 11-07): finetune_vae_jupiter_baseline_s44_256res.yaml (test
# ch-mean 0.0805) plus loss_weighting.weights.energy: 0.01, output_dir and tags. The loss is the VRMSE of
# E = p/(gamma-1) + (m_x^2 + m_y^2)/(2 rho) between the denormalized reconstruction and ground truth
# (windinet.losses.energy). Weights sized without a measured value: the baseline's total loss is
# ~0.014 and an energy VRMSE is probably 0.05-0.1, so 0.01 / 0.03 / 0.1 make it ~5% / 15% / 50% of the
# total. Check epoch 1's train_energy before trusting the larger weights.
# Launch: bash jobs/jupiter/submit_energy.sh

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  data_root: "/dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/256x256_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_256_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: 97  # 8*12+1, no padding (see header)
  eval_sims: 500
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  min_learning_rate: 1e-6
  scheduler_type: "cosine"
  epochs: 20
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.0
    mlw: 0.0
    energy: 0.01

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  epochs: [10, 20]   # mid-training and final; replaces interval_epochs
  num_samples: 3     # gamma min / median / max of the val split
  frame_numbers: [25, 50, 75, 97]
  dpi: 150
  save_video: true   # + GT/Prediction/Residual MP4 over all frames per sample

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse_chmean"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "cosine", "20ep", "shockwave-cfd", "jupiter", "energy0.01", "s44", "rmse-h1", "256res", "eval500", "f97"]

seed: 44
output_dir: "finetune_vae_jupiter_energy_1e2_s44_256res"
clean_output_dir: true
