# Chapter 6, Group 1 (VAE Adaptation Strategy) -- "Unfinetuned reference"
# arm. NOT a training config -- a materializer, same mechanism as the
# pre-Chapter-6 finetune_vae_unfinetuned_256res.yaml this is forked from.
#
# SINGLE VARIABLE vs finetune_vae_unfinetuned_256res.yaml:
#   data.eval_sims: 675 -> 500
# (kept for consistency with the other three Group 1 arms' split_manifest,
# even though eval_sims is otherwise inert here -- see below.)
#
# optimization.epochs: 0 means windinet/training/vae_trainer.py's training
# loop never executes a single step: no gradient update, no validation. The
# ONLY thing this run does is build the inflated adapter (mode="inflate",
# inflate_init="zeros" -- same init every other Chapter 6 arm starts from)
# at its freshly-initialized weights and save it via train()'s unconditional
# final checkpoint save. This is Group 1's zero-adaptation control: does the
# pretrained LTX-Video VAE need ANY CFD fine-tuning at all, or does the
# inflated-but-untouched decoder already reconstruct these fields
# reasonably?
#
# CHECKPOINT OUTPUT: because checkpoints.save_best_only=true and no epoch
# ever runs, `improved` is never set true -- only vae_shockwave_last.
# safetensors gets saved (save_last_state=true), NOT vae_shockwave_best.
# Point any downstream script (preprocess_dataset.py --inflate-checkpoint,
# latent_stats.py, etc.) at the `last/` checkpoint for this arm specifically.
#
# Launch (sng_pvc) -- runs in a couple minutes (model load + save, no data
# pass), default --time is overkill but harmless:
#   sbatch jobs/sng_pvc/finetune_vae.sbatch \
#       configs/finetune_vae/finetune_vae_ch6_unfinetuned_256res.yaml

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  data_root: "/dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/256x256_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_256_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 500
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  min_learning_rate: 1e-6
  scheduler_type: "wsd"
  stable_fraction: 0.7
  # THE variable vs every trained Group 1 arm: 30 -> 0. No training happens.
  epochs: 0
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.15
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: false
  interval_epochs: 4
  num_samples: 3
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "unfinetuned", "control", "shockwave-cfd", "chapter6", "256res", "eval500"]

seed: 42
output_dir: "finetune_vae_ch6_unfinetuned_256res"
clean_output_dir: true
