# Chapter 6, Group 5 (KL/SDS Compatibility Mitigation) -- "KL=1e-7" arm
# (weakest of the 3-point KL sweep).
#
# Fixed across all of Group 5: Group 1-3's winner (full-structure FT,
# assumed RMSE+H1+SSIM @ 5e-5, cosine -- see finetune_vae_ch6_full_ft_
# 256res.yaml; re-fork if a different combo wins). Same 256res data,
# eval_sims=500, epochs=20, seed=42.
#
# THIS ARM vs finetune_vae_ch6_full_ft_256res.yaml:
#   loss_weighting.weights.kl: (absent, i.e. 0.0) -> 1e-7
# rmse/h1/ssim/mlw weights unchanged -- KL is ADDED on top of the full
# combination, not a replacement.
#
# 3-point KL sweep: 1e-7 (this file) / 1e-6
# (finetune_vae_ch6_kl_1e6_256res.yaml) / 1e-5
# (finetune_vae_ch6_kl_1e5_256res.yaml). KL=0 is
# finetune_vae_ch6_full_ft_256res.yaml itself (no separate file needed).
#
# PURPOSE (this is Group 5's whole point, distinct from a plain VAE-quality
# ablation): KL/anchor-style regularization's pre-Chapter-6 history always
# measured it purely by its OWN reconstruction VRMSE, where it monotonically
# hurt (even the weakest weight tested anywhere in the project, 1e-7,
# already lost to the no-KL baseline). Group 5 asks a DIFFERENT question --
# does constraining the encoder's posterior toward N(0,I) improve
# VAE-DiT COMPATIBILITY (i.e. does a DiT trained on THESE latents roll out
# more accurately), even if it costs some raw reconstruction quality? Each
# arm here gets preprocessed into DiT latents and trained with the exact
# same DiT recipe as every other Group 4/5 arm, then compared on E_VAE
# (this arm's own val/test VRMSE), E_latent (DiT rollout vs GT latent), and
# E_pixel^rollout (full decoded rollout vs GT physical fields) -- not on
# E_VAE alone.
#
# This arm ALSO supplies Group 4's third VAE-DiT-compatibility checkpoint
# ("reconstructs reasonably but has a regularized/shifted latent space") --
# see the Chapter 6 planning discussion. Whichever KL weight here (1e-7/
# 1e-6/1e-5) turns out most informative for that comparison can be reused
# directly; no separate checkpoint needs to be trained for Group 4.
#
# Launch (sng_pvc):
#   sbatch jobs/sng_pvc/finetune_vae.sbatch \
#       configs/finetune_vae/finetune_vae_ch6_kl_1e7_256res.yaml \
#       "${SCRATCH}/windinet/euler_mq_dataset/256x256_ds/train.h5"

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  data_root: "/dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/256x256_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_256_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 500
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  min_learning_rate: 1e-6
  scheduler_type: "cosine"
  epochs: 20
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.15
    mlw: 0.0
    # THE variable vs finetune_vae_ch6_full_ft_256res.yaml.
    kl: 1.0e-7

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 4
  num_samples: 3
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "cosine", "20ep", "shockwave-cfd", "chapter6", "kl-sweep", "kl1e-7", "256res", "eval500"]

seed: 42
output_dir: "finetune_vae_ch6_kl_1e7_256res"
clean_output_dir: true
