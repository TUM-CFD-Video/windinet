# Chapter 6 -- training-resolution comparison: the current baseline
# (finetune_vae_ch6_loss_rmse_h1_256res.yaml, RMSE+H1, SSIM off) trained on
# 128x128 instead of 256x256.
#
# SINGLE VARIABLE vs finetune_vae_ch6_loss_rmse_h1_256res.yaml:
#   data.data_root / normalization_stats_file: 256x256_ds -> 128x128_ds
# Everything else (full-structure FT, loss weights, LR 5e-5 cosine, 20 epochs,
# eval_sims=500, seed) UNCHANGED.
#
# Launch (sng_pvc; no data_root argument -> CLUSTER_DEFAULTS' 128x128_ds):
#   bash jobs/sng_pvc/ch6_submit.sh vae128 loss_rmse_h1

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  data_root: "/dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/128x128_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_128_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 500
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  min_learning_rate: 1e-6
  scheduler_type: "cosine"
  epochs: 20
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.0
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 4
  num_samples: 3
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "cosine", "20ep", "shockwave-cfd", "chapter6", "loss-ablation", "rmse-h1", "128res", "eval500", "resolution-ablation"]

seed: 42
output_dir: "finetune_vae_ch6_loss_rmse_h1_128res"
clean_output_dir: true
