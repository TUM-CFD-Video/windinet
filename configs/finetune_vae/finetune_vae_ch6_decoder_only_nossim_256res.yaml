# ---------------------------------------------------------------------------
# NO-SSIM RERUN (2026-09-25). Identical to finetune_vae_ch6_decoder_only_256res.yaml except:
#   loss_weighting.weights.ssim: 0.15 -> 0.0
#   output_dir / wandb tags (new name so clean_output_dir cannot wipe the
#   original run's scratch dir)
# Why: the original run trained with the pre-fix SSIM loss (commit dd5302c
# fixed its luminance term on signed [-1,1] fields), and Chapter 6 dropped
# SSIM from the baseline. The baseline loss is now rmse 1.0 + h1 50.0, i.e.
# finetune_vae_ch6_loss_rmse_h1_256res.yaml, which is this arm's reference.
# The original header below is kept as-is for the arm's rationale; wherever
# it says "full_ft" / RMSE+H1+SSIM, read loss_rmse_h1 / RMSE+H1.
#
# Launch (sng_pvc):
#   sbatch jobs/sng_pvc/finetune_vae.sbatch \
#       configs/finetune_vae/finetune_vae_ch6_decoder_only_nossim_256res.yaml
# ---------------------------------------------------------------------------
# Chapter 6, Group 1 (VAE Adaptation Strategy) -- "Decoder-only" arm.
#
# Forked from finetune_vae_ch6_full_ft_256res.yaml (which already carries
# the campaign-wide 2026-09-23 decision: epochs=20, eval_sims=500). THE
# variables that jointly define "decoder-only" vs that file:
#   adapter.freeze_conv_in:        false -> true
#   adapter.unfreeze_encoder_trunk: true -> false
#
# What this actually trains: encoder.conv_in is grown 3->4 channels at init
# (inflate_init: zeros, same as every other Chapter 6 arm) so the VAE CAN
# read 4-channel input, but conv_in itself never receives a gradient
# (freeze_conv_in: true) and the rest of the encoder trunk
# (down_blocks[0:3] + tail) also never unfreezes (unfreeze_encoder_trunk:
# false) -- so the encoder is 100% frozen at its pretrained-3-channel-basis
# state (plus a zero-initialized, never-updated 4th input slot). Only the
# decoder (552.8M params, always trainable regardless of mode -- see
# vae_trainer.py's _load_vae) is fine-tuned. This is the "cheapest possible"
# adaptation short of not touching the pretrained VAE at all (that's the
# separate "Unfinetuned reference" arm).
#
# Everything else (loss weights, LR, schedule, epochs, eval_sims=500, seed)
# UNCHANGED vs the full-FT arm, so Group 1's four arms differ ONLY in which
# part of the VAE is allowed to move.
#
# Launch (sng_pvc): sbatch jobs/sng_pvc/finetune_vae.sbatch \
#     configs/finetune_vae/finetune_vae_ch6_decoder_only_256res.yaml

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: true
  unfreeze_encoder_trunk: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  data_root: "/dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/256x256_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_256_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 500
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  min_learning_rate: 1e-6
  scheduler_type: "cosine"
  epochs: 20
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.0  # dropped from the Chapter 6 baseline, see header
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 4
  num_samples: 3
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "cosine", "20ep", "shockwave-cfd", "chapter6", "decoder-only", "256res", "eval500", "no-ssim"]

seed: 42
output_dir: "finetune_vae_ch6_decoder_only_nossim_256res"
clean_output_dir: true
