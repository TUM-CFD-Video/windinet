# ---------------------------------------------------------------------------
# Chapter 6, Group 1 (VAE adaptation strategy) -- "conv_in-only" arm (2026-09-26).
#
# Identical to finetune_vae_ch6_decoder_only_nossim_256res.yaml except:
#   adapter.freeze_conv_in: true -> false
#   output_dir / wandb tags
#
# What this trains: the whole decoder, plus encoder.conv_in (the grown
# 3->4-channel input projection). The encoder trunk (down_blocks[0:3] + tail)
# stays frozen (unfreeze_encoder_trunk: false), exactly as in decoder-only.
#
# Why: the decoder-only arm confounds two things. Its conv_in is frozen and
# the pressure slot is zero-initialized (inflate_init: zeros), so the encoder
# never sees pressure at all, and its +77% chmean gap vs the baseline is
# mostly pressure. This arm lets pressure into the latent without adapting
# the trunk, which splits Group 1 into a clean ladder:
#   decoder-only (decoder) -> conv_in-only (+ conv_in) -> full FT (+ trunk)
#
# Runs on jupiter (4 GPUs, batch 4 x accum 2 = effective batch 32, same as
# sng_pvc's 8 tiles x batch 4), 256x256_ds from CLUSTER_DEFAULTS["jupiter"]:
#   sbatch jobs/jupiter/finetune_vae.sbatch configs/finetune_vae/finetune_vae_ch6_conv_in_only_256res.yaml
# A 20-epoch full FT takes ~3.5h on jupiter, and this arm backpropagates
# through the whole (frozen) encoder to reach conv_in, so its cost is close
# to full FT. One job at --time=06:00:00 (the sbatch default) is enough.
# ---------------------------------------------------------------------------

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false  # the one change vs decoder_only_nossim
  unfreeze_encoder_trunk: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  data_root: "/dss/dssfs02/pn82ku/pn82ku-dss-0000/neptuna_stuff/datasets/Euler_MQ/data/256x256_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_256_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 500
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  min_learning_rate: 1e-6
  scheduler_type: "cosine"
  epochs: 20
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.0  # dropped from the Chapter 6 baseline, see header
    mlw: 0.0

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

visualization:
  enabled: true
  interval_epochs: 4
  num_samples: 3
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "cosine", "20ep", "shockwave-cfd", "chapter6", "conv-in-only", "256res", "eval500", "no-ssim"]

seed: 42
output_dir: "finetune_vae_ch6_conv_in_only_256res"
clean_output_dir: true
