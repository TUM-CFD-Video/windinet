# VAE finetuning config -- lundquist/128x128 KL-vs-SDS sweep, arm 3/3 (SDS,
# score-distillation). See finetune_vae_whole_structure_baseline_ep20_kl0.yaml
# (arm 1/3, the reference) for the full sweep rationale. SINGLE VARIABLE vs
# that file: adds the "sds" loss term (windinet.training.sds_loss.
# SdsDistillationLoss, see windinet/config.py's SdsLossConfig docstring for
# the full formula) -- everything else (resolution, cosine schedule, peak
# LR, adapter, the other four loss weights) UNCHANGED, so all 3 sweep arms
# stay directly comparable to each other. NOTE: this deliberately diverges
# from finetune_vae_whole_structure_baseline_ep20_256res_sds.yaml (the
# sng_pvc/256res SDS arm this is otherwise modeled on, job 535151/535182),
# which uses "wsd" -- this sweep's own kl0/kl1e7 siblings are cosine (to
# match the sng_pvc cosine KL sweep the whole thing is trying to explain),
# so sds is kept cosine too rather than importing wsd from its sng_pvc
# namesake.
#
# RESOLVED (2026-09-15): this config used to be blocked on lundquist having
# no real trained DiT checkpoint of its own -- it does now. sds.dit_checkpoint
# below points at dit_sds_untrained (the w=0.1, UNTRAINED-critic arm from
# this same sweep family, job chain finished at step 8033), lundquist's best
# real DiT result so far (see project_dit_stage2_multicluster memory:
# ep20_baseline-beating on latent_vrmse, and the only lundquist SDS arm
# confirmed via diagnose_latent_scale.py NOT to be a latent-collapse
# artifact). Using an ACTUALLY-TRAINED critic here (instead of the random-init
# one every sds_w*.yaml sibling deliberately used, to avoid circularity) is
# the direct test of whether a trained critic's learned denoising preferences
# -- fed back into a fresh VAE finetune -- close some of the gap between
# this arm's good latent_vrmse (0.037) and its worse-than-w0.1 pixel_vrmse
# (0.547 vs 0.394) once a NEW DiT is trained against the resulting VAE.
# Mirrors how the ORIGINAL sng_pvc SDS win (job 535840/536316, beat
# ep20_baseline) was set up -- that one also used an already-trained critic,
# just a different arm/cluster/resolution than lundquist's untrained-critic
# sweep.
#
# WEIGHT (sds: 0.1 below) is an UNTUNED FIRST GUESS carried over from the
# sng_pvc SDS config, not a swept value -- see that file's own header for the
# reasoning (roughly same order of magnitude as rmse's weight 1.0, assuming
# the raw SDS residual lands in the same 0.01-1 range the converged
# flow-matching loss does -- unconfirmed at 128res).
#
# NOTE: this loads a SECOND frozen model (the 2B-parameter DiT transformer)
# into memory for the whole run and runs an extra full transformer forward
# pass every train/eval step -- expect materially higher memory and
# wall-clock than the kl0/kl1e7 siblings; not yet measured on lundquist's
# A6000s (only measured, informally, on sng_pvc's XPUs so far).
#
# Usage:
#   sbatch jobs/lundquist/finetune_vae_2gpu.sbatch \
#       configs/finetune_vae/finetune_vae_whole_structure_baseline_ep20_sds.yaml
#
# Once this finishes, the resulting VAE checkpoint needs its OWN new DiT
# trained from scratch before it can be evaluated -- this finetune changes
# the encoder, hence the latent space, so no existing DiT checkpoint (this
# one's own critic included) is valid against it. Full chain: preprocess
# (jobs/lundquist/preprocess_dit_data.sbatch against this run's
# vae_shockwave_best.safetensors) -> train (jobs/lundquist/train_dit_2gpu.sbatch)
# -> eval (jobs/lundquist/eval_dit_vrmse.sbatch), same as every other arm.

model:
  model_source: "LTXV_2B_0.9.6_DEV"

adapter:
  enabled: true
  mode: "inflate"
  inflate_init: "zeros"
  freeze_conv_in: false
  checkpoint: null
  channels: ["density", "momentum_x", "momentum_y", "pressure"]
  activation: "gelu"
  default_temb: 0.0

resume_from: null
resume_weights_only: false

data:
  data_root: "/local/disk/hramachandran/work/wh_work/windinet/euler_mq_dataset/128x128_ds/train.h5"
  normalization_stats_file: "configs/finetune_vae/euler_mq_128_only_train.yaml"
  normalization_clip: 5.0
  num_sim_frames: null
  eval_sims: 675
  num_dataloader_workers: 4

optimization:
  learning_rate: 5e-5
  min_learning_rate: 1e-6
  scheduler_type: "cosine"
  epochs: 20
  batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 5.0
  weight_decay: 0.0
  warmup_steps: 200
  warmup_start_factor: 0.01
  enable_gradient_checkpointing: true

loss_weighting:
  strategy: "fixed"
  weights:
    rmse: 1.0
    h1: 50.0
    ssim: 0.15
    mlw: 0.0
    # THE variable vs the ep20_kl0 baseline -- see header. Untuned first
    # guess, not swept.
    sds: 0.1

loss:
  wavelet: "db2"
  spatial_level: 2
  temporal_level: 2
  mlw_beta: 10.0
  mlw_eps: 1.0e-6

# THE other half of the variable above -- see header for the full formula
# and windinet/config.py's SdsLossConfig for every field's meaning.
sds:
  enabled: true
  model_source: "LTXV_2B_0.9.6_DEV"
  # dit_sds_untrained: lundquist's own trained w=0.1/untrained-critic arm
  # (see the RESOLVED note at the top of this file). This field does not
  # expand env vars (unlike output_dir), same convention as every DiT resume
  # config's model.load_checkpoint -- must stay an absolute path.
  dit_checkpoint: "/local/disk/hramachandran/work/wh_work/windinet/dit_outputs/lundquist/dit_sds_untrained/checkpoints/model_weights_step_08033.safetensors"
  scalar_conditioning:
    enabled: true
    scalar_names: ["gamma"]
    scalar_ranges:
      gamma: [1.0, 2.0]
    embedding_dim: 4096
    num_tokens_per_scalar: 4
    fourier_features: 64
    mlp_hidden_dim: 256
    dropout: 0.1
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

visualization:
  enabled: true
  interval_epochs: 4
  num_samples: 3
  frame_numbers: [25, 50, 75, 100]
  dpi: 150

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

checkpoints:
  interval: 1
  save_best_only: true
  best_metric: "val_vrmse"
  save_last_state: true
  keep_last_n: 1

wandb:
  enabled: false
  project: "windinet"
  tags: ["vae", "inflate", "zeros-init", "cosine", "20ep", "lr1x", "shockwave-cfd", "whole-structure-baseline", "128res", "kl-sds-sweep", "sds", "trained-critic"]

seed: 42
output_dir: "finetune_vae_whole_structure_baseline_ep20_sds_trained_critic"
clean_output_dir: true
