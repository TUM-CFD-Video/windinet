# Fine-tune the Wan VAE behind a fixed adapter (wan_pairs_h1_50.pt, trained with the same loss).
# Recipe follows configs/finetune_vae/finetune_vae_ch6_*_256res.yaml: AdamW, peak lr -> 2 % of it, 1 % linear
# warm-up then cosine, grad clip 5, RMSE + 50 H1, 16 frames per update (here 8 sims x 2 frames, fp32,
# one clip per backward). Variants via CLI, e.g. --set train.vae_parts=all, or 5-frame clips instead of
# single frames: --set data.clip=true --set data.frames_per_sim=5 --set train.batch_sims=3
name: wan_ft_decoder
vae: wan

data:
  h5_path: euler_mq_dataset/256x256_ds/test.h5
  stats_json: results/field_adapter/00_stats/eulermq_256_test_stats.json
  test_every: 5
  frames_per_sim: 2
  num_workers: 2

adapter:
  groups: [[density, pressure], [momentum_x, momentum_y]]
  load: results/field_adapter/20_wan_roundtrip/wan_pairs_h1_50/adapter.pt

loss:
  rmse: 1.0
  h1: 50.0

train:
  steps: 120
  batch_sims: 8
  lr: 0.0            # adapter fixed; 3.0e-3 co-trains it
  vae_parts: decoder
  vae_lr: 1.0e-6     # chapter 6 uses 5e-5; that diverges for the Wan decoder (ablations, section 7)
  warmup_steps: 12
  max_grad_norm: 5.0
  eval_every: 20
  seed: 0

ref_stats: results/field_adapter/30_reference/wan_ref_stats.pt
