# Field adapter on euler_mq 256x256 (the rha6696 test shards, 50 sims per gamma) through the frozen Wan VAE.
# Adapter experiments; VAE fine-tuning lives in eulermq_finetune.yaml. Vary runs with CLI overrides, e.g.
#   python scripts/field_adapter/train_adapter.py configs/field_adapter/eulermq.yaml \
#       --name pairs_600 --desc "pairs, 600 steps" --set train.steps=600
#   python scripts/field_adapter/train_adapter.py configs/field_adapter/eulermq.yaml \
#       --name eval_only --desc "..." --set train.steps=0 --set adapter.load=results/field_adapter/20_wan_roundtrip/<run>/adapter.pt
#   --set data.test_gamma=1.76 holds out a whole gamma instead of every 5th simulation.
# The reference statistics are produced locally by download_pexels.py + ref_latents.py (needs a Pexels key).
name: pairs
vae: wan

data:
  h5_path: euler_mq_dataset/256x256_ds/test.h5
  stats_json: results/field_adapter/00_stats/eulermq_256_test_stats.json
  test_every: 5
  frames_per_sim: 2
  num_workers: 2

adapter:
  groups: [[density, pressure], [momentum_x, momentum_y]]

loss:
  rmse: 1.0
  h1: 1.0

train:
  steps: 600
  batch_sims: 1
  lr: 3.0e-3
  eval_every: 300
  seed: 0

ref_stats: results/field_adapter/30_reference/wan_ref_stats.pt
