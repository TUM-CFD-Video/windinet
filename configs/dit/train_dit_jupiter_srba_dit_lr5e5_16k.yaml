# 2D-SRBA-OOOO DiT round 2 (2026-10-25) on the SRBA baseline VAE's latents
# (finetune_vae_jupiter_srba_baseline_256res). Round 1 (submit_srba_sweep.sh):
# DiT LR 5e-5 best (0.1320 vs 0.1348), 4k steps much worse (0.1738) -> 8k not saturated.
# This arm: the dit_lr5e5 arm with steps 8000 -> 16000 (cosine over 16000).
# Launch: bash jobs/jupiter/submit_srba_round2.sh (DiT + 1 resume + diteval)

model:
  model_source: "LTXV_2B_0.9.6_DEV"
  load_checkpoint: null

conditioning:
  first_frame_conditioning_p: 1.0

scalar_conditioning:
  enabled: true
  scalar_names:
    - "mach"
  scalar_ranges:
    mach: [1.3, 2.1]
  embedding_dim: 4096
  num_tokens_per_scalar: 4
  fourier_features: 64
  mlp_hidden_dim: 256
  dropout: 0.1

optimization:
  learning_rate: 5e-5
  steps: 16000
  batch_size: 1
  gradient_accumulation_steps: 8  # 4 GPUs x 1 x 8 = effective batch 32, same as sng_pvc's 8 tiles x 1 x 4
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "cosine"
  scheduler_params:
    eta_min: 1.0e-8
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

data:
  preprocessed_data_root: "__PREPROCESSED_ROOT__"
  num_dataloader_workers: 4

validation:
  data_root: "__PREPROCESSED_ROOT__/val"
  interval: 600
  max_samples: 0

checkpoints:
  interval: 120
  keep_last_n: 2

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

visualization:
  # Off on sng_pvc (XPU OUT_OF_RESOURCES after the first pass, jobs
  # 534853/534884); on here (GH200). Rank 0 only, RNG saved/restored, so it
  # does not change training.
  enabled: true
  steps: [16000]       # end of training only; replaces interval
  num_samples: 3       # fixed, evenly spaced over the val split
  frame_numbers: [25, 50, 75, 97]
  save_video: true     # + GT/Prediction/Residual MP4 over all frames per sample

wandb:
  enabled: false
  project: "shockwavenet"
  tags: ["cfd", "full", "2b", "scalar-only", "jupiter", "256res", "srba", "dit_lr5e5_16k", "eval24", "lr5e5", "16k", "f97"]

seed: 42
output_dir: "/e/scratch/e-dev-2026d09-262/wh_work/dit_outputs/shockwave_dit_jupiter_srba_dit_lr5e5_16k"
