# SRBA "1-1-2" setup (PhD advisor, 2026-11-22): 1 conditioning frame + temporal stride 2, plus
# x-axis flip augmentation and a VRMSE / VRMSE+H1 loss sweep. For LTX-Video (joint, not
# autoregressive generation) "1-1-2" = 1 conditioning frame (frame 0 only, 1 conditioning
# latent) at stride 2: stored frames 0, 2, ..., 96 = 49 frames = 7 latents.
# Loss scale (SRBA baseline, end of training): rmse 0.0092, h1 0.00025, vrms 0.053; so in
# rmse + 50*h1 the h1 term is ~57% of the loss, and vrms 1 + ~290*h1 has the same share.
# The h1 sweep 10/30/100/300/1000 spans h1 share ~5% .. ~80%.
# Launch all arms: bash jobs/jupiter/submit_srba_s2.sh
# DiT arm s2_flip_sds_3e3 on the latents of finetune_vae_jupiter_srba_s2_flip_sds_3e3_256res
# (the s2_flip VAE + stock-teacher SDS loss). DiT recipe identical to train_dit_jupiter_srba_s2_flip.yaml.
# Base: train_dit_jupiter_srba_dit_lr5e5.yaml (best SRBA DiT: LR 5e-5, 8k steps); changed: explicit
# 1 conditioning latent, visualization frames, tags, output_dir. Stride and the mirrored
# training latents (flipy_<id>, when the VAE used flip_augment) come from the latents.

model:
  model_source: "LTXV_2B_0.9.6_DEV"
  load_checkpoint: null

conditioning:
  first_frame_conditioning_p: 1.0
  num_conditioning_latent_frames: 1  # frame 0 only (the "1" of 1-1-2)

scalar_conditioning:
  enabled: true
  scalar_names:
    - "mach"
  scalar_ranges:
    mach: [1.3, 2.1]
  embedding_dim: 4096
  num_tokens_per_scalar: 4
  fourier_features: 64
  mlp_hidden_dim: 256
  dropout: 0.1

optimization:
  learning_rate: 5e-5
  steps: 8000
  batch_size: 1
  gradient_accumulation_steps: 8  # 4 GPUs x 1 x 8 = effective batch 32, same as sng_pvc's 8 tiles x 1 x 4
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "cosine"
  scheduler_params:
    eta_min: 1.0e-8
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

data:
  preprocessed_data_root: "__PREPROCESSED_ROOT__"
  num_dataloader_workers: 4

validation:
  data_root: "__PREPROCESSED_ROOT__/val"
  interval: 600
  max_samples: 0

checkpoints:
  interval: 120
  keep_last_n: 2

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

visualization:
  # Off on sng_pvc (XPU OUT_OF_RESOURCES after the first pass, jobs
  # 534853/534884); on here (GH200). Rank 0 only, RNG saved/restored, so it
  # does not change training.
  enabled: true
  steps: [8000]        # end of training only; replaces interval
  num_samples: 3       # fixed, evenly spaced over the val split
  frame_numbers: [13, 25, 37, 49]  # stored frames 24, 48, 72, 96
  save_video: true     # + GT/Prediction/Residual MP4 over all frames per sample

wandb:
  enabled: false
  project: "shockwavenet"
  tags: ["cfd", "full", "2b", "scalar-only", "jupiter", "256res", "srba", "s2_flip_sds_3e3", "eval24", "lr5e5", "stride2", "f49", "cond1"]

seed: 42
output_dir: "/e/scratch/e-dev-2026d09-262/wh_work/dit_outputs/shockwave_dit_jupiter_srba_s2_flip_sds_3e3"
