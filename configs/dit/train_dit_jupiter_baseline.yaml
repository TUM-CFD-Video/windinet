# Jupiter baseline DiT -- reference point for the post-thesis experiments.
# VAE: finetune_vae_jupiter_baseline_256res (= the thesis baseline VAE recipe)
#
# Identical to the thesis baseline DiT (train_dit_sng_pvc_ch6_loss_rmse_h1.yaml:
# full transformer, flow matching, steps=8000, LR=1e-5 cosine, effective batch
# 32, seed=42), so its test VRMSE is directly comparable to THESIS_RESULTS.md
# (VAE + DiT ch-mean 0.4984). Differences:
#   optimization.gradient_accumulation_steps: 4 -> 8 (4 GPUs instead of 8 tiles)
#   output_dir on jupiter scratch, wandb tags.
#
# Latents must be encoded with EVAL_SIMS=500 (preprocess_dit_data.sbatch's
# default on jupiter). Launch: bash jobs/jupiter/submit_baseline_pipeline.sh

model:
  model_source: "LTXV_2B_0.9.6_DEV"
  load_checkpoint: null

conditioning:
  first_frame_conditioning_p: 1.0

scalar_conditioning:
  enabled: true
  scalar_names:
    - "gamma"
  scalar_ranges:
    gamma: [1.0, 2.0]
  embedding_dim: 4096
  num_tokens_per_scalar: 4
  fourier_features: 64
  mlp_hidden_dim: 256
  dropout: 0.1

optimization:
  learning_rate: 1e-5
  steps: 8000
  batch_size: 1
  gradient_accumulation_steps: 8  # 4 GPUs x 1 x 8 = effective batch 32, same as sng_pvc's 8 tiles x 1 x 4
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "cosine"
  scheduler_params:
    eta_min: 1.0e-8
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

data:
  preprocessed_data_root: "__PREPROCESSED_ROOT__"
  num_dataloader_workers: 4

validation:
  data_root: "__PREPROCESSED_ROOT__/val"
  interval: 600
  max_samples: 0

checkpoints:
  interval: 120
  keep_last_n: 2

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

visualization:
  enabled: false  # disabled, same reasoning as every sng_pvc DiT config since
  # 2026-09-07 (job 534853/534884: UR_RESULT_ERROR_OUT_OF_RESOURCES on ranks
  # 2-7 one step after the first visualization trigger). Re-enable once
  # root-caused; backfill PNG panels/VRMSE curve post-hoc against saved
  # checkpoints in the meantime.
  interval: 2000

wandb:
  enabled: false
  project: "shockwavenet"
  tags: ["cfd", "full", "2b", "scalar-only", "jupiter", "256res", "eval500", "baseline"]

seed: 42
output_dir: "/e/scratch/e-dev-2026d09-262/wh_work/dit_outputs/shockwave_dit_jupiter_baseline"
