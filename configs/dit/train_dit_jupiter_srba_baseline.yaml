# 2D-SRBA-OOOO baseline DiT (2026-10-24, PhD advisor) on the SRBA baseline VAE
# (finetune_vae_jupiter_srba_baseline_256res). Same recipe as the current
# Euler_MQ baseline DiT (train_dit_jupiter_baseline_s44_lr1e4: full transformer,
# LR 1e-4 cosine, 8000 steps, effective batch 32; eval at 5 sampler steps).
# Differences:
#   scalar_conditioning: Mach number only ("mach", parsed from the "_Mas1.30"
#     part of the sim id), range [1.3, 2.1] from the dataset card
#     (huggingface.co/datasets/FluidVerse/2D_SRBA_OOOO). Bubble count, position
#     and radius are not conditioned on: they are visible in the first frame.
#   216 train latents instead of 4000, so 8000 steps x 32 is ~1200 passes over
#     the training set (Euler_MQ ~64) -- watch val loss for overfitting.
#   The dataset itself needs no setting here: preprocess_dataset.py records the
#     VAE run's data.dataset in the latents' normalization.json.
# Launch: bash jobs/jupiter/submit_srba_baseline.sh

model:
  model_source: "LTXV_2B_0.9.6_DEV"
  load_checkpoint: null

conditioning:
  first_frame_conditioning_p: 1.0

scalar_conditioning:
  enabled: true
  scalar_names:
    - "mach"
  scalar_ranges:
    mach: [1.3, 2.1]
  embedding_dim: 4096
  num_tokens_per_scalar: 4
  fourier_features: 64
  mlp_hidden_dim: 256
  dropout: 0.1

optimization:
  learning_rate: 1e-4
  steps: 8000
  batch_size: 1
  gradient_accumulation_steps: 8  # 4 GPUs x 1 x 8 = effective batch 32, same as sng_pvc's 8 tiles x 1 x 4
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "cosine"
  scheduler_params:
    eta_min: 1.0e-8
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

data:
  preprocessed_data_root: "__PREPROCESSED_ROOT__"
  num_dataloader_workers: 4

validation:
  data_root: "__PREPROCESSED_ROOT__/val"
  interval: 600
  max_samples: 0

checkpoints:
  interval: 120
  keep_last_n: 2

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

visualization:
  # Off on sng_pvc (XPU OUT_OF_RESOURCES after the first pass, jobs
  # 534853/534884); on here (GH200). Rank 0 only, RNG saved/restored, so it
  # does not change training.
  enabled: true
  steps: [8000]        # end of training only; replaces interval
  num_samples: 3       # fixed, evenly spaced over the val split
  frame_numbers: [25, 50, 75, 97]
  save_video: true     # + GT/Prediction/Residual MP4 over all frames per sample

wandb:
  enabled: false
  project: "shockwavenet"
  tags: ["cfd", "full", "2b", "scalar-only", "jupiter", "256res", "srba", "eval24", "lr1e4", "f97"]

seed: 42
output_dir: "/e/scratch/e-dev-2026d09-262/wh_work/dit_outputs/shockwave_dit_jupiter_srba_baseline"
