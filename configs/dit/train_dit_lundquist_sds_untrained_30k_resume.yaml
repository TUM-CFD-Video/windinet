# Resume of train_dit_lundquist_sds_untrained_30k.yaml -- use this once that
# job gets killed by the debug partition's time limit partway through 30000
# steps. Same pattern as train_dit_lundquist_cosine_kl0_15k_resume.yaml:
# model.load_checkpoint below points at the checkpoints/ DIRECTORY rather
# than a specific step file so dit_trainer.py's _find_checkpoint() picks
# whichever is actually newest on disk (max by parsed step number, not
# filesystem order), instead of hardcoding a step count that might be off by
# one checkpoint interval (checkpoints.interval=120 below).
#
# Everything else is IDENTICAL to train_dit_lundquist_sds_untrained_30k.yaml,
# same output_dir (resume in place, not a new run) -- the sibling
# '<stem>.state.pt' next to the loaded checkpoint restores
# optimizer/scheduler/global_step/RNG automatically, so optimization.steps
# stays 30000 and the ORIGINAL cosine schedule (T_max=30000) continues from
# wherever it left off -- resume_weights_only is intentionally left at its
# default (false): this is a true continuation of a killed run, not a warm
# restart with a different schedule.
#
# If the first job needs killing more than once, just resubmit this same
# file again -- _find_checkpoint always picks up the latest checkpoint on
# disk, so it's idempotent to rerun.
#
# Launched the same way as the original run, by jobs/lundquist/train_dit_2gpu.sbatch,
# which substitutes __PREPROCESSED_ROOT__ for dit_preprocessed/<PREPROCESSED_NAME>:
#   sbatch --time=12:00:00 jobs/lundquist/train_dit_2gpu.sbatch \
#       finetune_vae_whole_structure_baseline_ep20_sds_untrained \
#       configs/dit/train_dit_lundquist_sds_untrained_30k_resume.yaml

model:
  model_source: "LTXV_2B_0.9.6_DEV"
  load_checkpoint: "dit_outputs/lundquist/dit_sds_untrained_30k/checkpoints"

conditioning:
  first_frame_conditioning_p: 1.0

scalar_conditioning:
  enabled: true
  scalar_names:
    - "gamma"
  scalar_ranges:
    gamma: [1.0, 2.0]
  embedding_dim: 4096
  num_tokens_per_scalar: 4
  fourier_features: 64
  mlp_hidden_dim: 256
  dropout: 0.1

optimization:
  learning_rate: 1e-5
  steps: 30000
  batch_size: 4
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "cosine"
  scheduler_params:
    eta_min: 1.0e-8
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  compile_with_inductor: false

data:
  preprocessed_data_root: "__PREPROCESSED_ROOT__"
  num_dataloader_workers: 4

validation:
  data_root: "__PREPROCESSED_ROOT__/val"
  interval: 600
  max_samples: 0

checkpoints:
  interval: 120
  keep_last_n: 2

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

visualization:
  enabled: true
  interval: 2000

wandb:
  enabled: false
  project: "shockwavenet"
  tags: ["cfd", "full", "2b", "scalar-only", "lundquist", "128res", "sds-vae", "sds-untrained-critic", "sds-w0p1", "30k-steps", "resume"]

seed: 42
output_dir: "dit_outputs/lundquist/dit_sds_untrained_30k"
