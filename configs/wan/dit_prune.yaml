# Pruned students of res256/pairs/unrolled/unrolled2 (docs/wan/dit_pruning.md): the teacher's weights cut at load time
# (prune.*, chosen and refit on calibration states of our train sims), then recovered with the teacher's unrolled
# recipe plus distillation from the frozen teacher. Everything else comes from the teacher's config.yaml. Arms:
#   torchrun --standalone --nproc_per_node=8 scripts/wan/train_dit.py configs/wan/dit_prune.yaml \
#       --set prune.depth=14 --name res256/pairs/pruned/<arm> --desc "..."
extends: load
load: results/wan/eulermq/dit/res256/pairs/unrolled/unrolled2
load_step: null
prune: {}
distill:
  teacher: results/wan/eulermq/dit/res256/pairs/unrolled/unrolled2
  features: 1.0
train:
  steps: 1500
  lr: 1.0e-5
  patchify_lr: 1.0e-5
  warmup_steps: 100
  eval_every: 500
  seed: 5
