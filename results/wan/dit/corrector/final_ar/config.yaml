# final_ar: stage 2 of final_tf: from its teacher-forced step-1000 weights, AR training on own burn-in history, MSE, EMA
# Re-run: python scripts/wan/train_corrector.py results/wan/dit/corrector/final_ar/config.yaml --name <new name>
name: final_ar
description: 'stage 2 of final_tf: from its teacher-forced step-1000 weights, AR training on own burn-in history, MSE, EMA'
model:
  history: 1
  first_frame: true
  channels:
  - 64
  - 128
  - 128
  - 256
  layers_per_block: 2
  precision: mixed
data:
  h5_path: euler_mq_dataset/256x256_ds/train.h5
  test_h5: euler_mq_dataset/256x256_ds/test.h5
  stats_json: results/field_adapter/00_stats/eulermq_256_train_stats.json
  val_sims: 500
  split_seed: 42
  eval_sims: 64
  test_sims: null
  test_every: 5
  test_gamma: null
  frames_per_sim: 2
  clip: false
  frame_stride: 2
  augment: true
  num_workers: 4
  latents: null
train:
  steps: 3000
  batch_sims: 32
  window: 4
  teacher_forcing: false
  history_noise: 0.0
  loss: mse
  ema: 0.995
  lr: 0.0001
  weight_decay: 0.01
  warmup_steps: 200
  lr_floor: 0.01
  max_grad_norm: 1.0
  eval_every: 1000
  log_every: 50
  seed: 0
rollouts:
- /scratch/project_465003416/lc_work/fields/stage3_d4_steps2_val500
- /scratch/project_465003416/lc_work/fields/stage3_d4_steps2_seed11
- /scratch/project_465003416/lc_work/fields/stage3_d4_steps2_seed12
- /scratch/project_465003416/lc_work/fields/stage3_d4_steps2_seed13
load: /scratch/project_465003416/lc_work/weights/wan/corrector/final_tf_stage1
results_dir: results/wan/dit/corrector
weights_dir: /scratch/project_465003416/lc_work/weights
