# smoke/ar: smoke: AR corrector, 40 updates, speed and memory, MIOpen fast find
# Re-run: python scripts/wan/train_corrector.py results/wan/dit/corrector/smoke/ar/config.yaml --name <new name>
name: smoke/ar
description: 'smoke: AR corrector, 40 updates, speed and memory, MIOpen fast find'
model:
  history: true
  channels:
  - 64
  - 128
  - 128
  - 256
  layers_per_block: 2
  precision: mixed
data:
  h5_path: euler_mq_dataset/256x256_ds/train.h5
  test_h5: euler_mq_dataset/256x256_ds/test.h5
  stats_json: results/field_adapter/00_stats/eulermq_256_train_stats.json
  val_sims: 500
  split_seed: 42
  eval_sims: 16
  test_sims: 16
  test_every: 5
  test_gamma: null
  frames_per_sim: 2
  clip: false
  frame_stride: 2
  augment: true
  num_workers: 4
  latents: null
train:
  steps: 40
  batch_sims: 32
  window: 4
  lr: 0.0002
  weight_decay: 0.01
  warmup_steps: 500
  lr_floor: 0.01
  max_grad_norm: 1.0
  eval_every: 1000
  log_every: 5
  seed: 0
rollouts:
- /scratch/project_465003416/lc_work/fields/stage3_d4_steps2_val500
- /scratch/project_465003416/lc_work/fields/stage3_d4_steps2_seed11
- /scratch/project_465003416/lc_work/fields/stage3_d4_steps2_seed12
- /scratch/project_465003416/lc_work/fields/stage3_d4_steps2_seed13
load: null
results_dir: results/wan/dit/corrector
weights_dir: /scratch/project_465003416/lc_work/weights
