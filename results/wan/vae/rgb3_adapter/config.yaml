# rgb3_adapter: rho, m_x, m_y in one image; stage 1 of two_stage: adapter alone on the frozen VAE, 2000 steps of 2 single frames
# Re-run: python scripts/wan/train_vae.py results/wan/vae/rgb3_adapter/config.yaml --name <new name>
name: rgb3_adapter
description: 'rho, m_x, m_y in one image; stage 1 of two_stage: adapter alone on the frozen VAE, 2000 steps of 2 single frames'
vae: wan
data:
  h5_path: euler_mq_dataset/256x256_ds/train.h5
  test_h5: euler_mq_dataset/256x256_ds/test.h5
  stats_json: results/field_adapter/00_stats/eulermq_256_test_stats.json
  val_sims: 500
  split_seed: 42
  eval_sims: 100
  test_sims: 100
  test_every: 5
  test_gamma: null
  frames_per_sim: 2
  clip: false
  num_workers: 2
adapter:
  groups:
  - - density
    - momentum_x
    - momentum_y
loss:
  rmse: 1.0
  h1: 1.0
train:
  steps: 2000
  batch_sims: 1
  micro_batch: 3
  lr: 0.003
  vae_parts: none
  vae_lr: 1.0e-06
  warmup_steps: 0
  lr_floor: 0.02
  max_grad_norm: 0.0
  eval_every: 500
  log_every: 10
  seed: 0
results_dir: results/wan/vae
