# res256/quad/full9/median: eval-only of res256/quad/full9 for the per-sim median VRMSE on the 100 test sims
# Re-run: python scripts/wan/train_vae.py results/wan/vae/res256/quad/full9/median/config.yaml --name <new name>
name: res256/quad/full9/median
description: eval-only of res256/quad/full9 for the per-sim median VRMSE on the 100 test sims
vae: wan
data:
  h5_path: euler_mq_dataset/256x256_ds/train.h5
  test_h5: euler_mq_dataset/256x256_ds/test.h5
  stats_json: results/field_adapter/00_stats/eulermq_256_train_stats.json
  val_sims: 500
  split_seed: 42
  eval_sims: 100
  test_sims: 100
  test_every: 5
  test_gamma: null
  frames_per_sim: 5
  clip: true
  frame_stride: 2
  augment: false
  num_workers: 2
  latents: null
adapter:
  groups:
  - - density
    - momentum_x
    - momentum_y
    - pressure
loss:
  rmse: 1.0
  h1: 1.0
  latent: 0.0
  kind: rmse_h1
train:
  steps: 0
  batch_sims: 6
  micro_batch: 6
  adapter_lr: 0.0
  vae_parts: none
  precision: fp32
  checkpointing: true
  vae_per_group: false
  vae_lr: 1.0e-06
  io_lr: null
  warmup_steps: 100
  lr_floor: 0.02
  max_grad_norm: 5.0
  eval_every: 100
  log_every: 10
  seed: 0
load: results/wan/vae/res256/quad/full9
results_dir: results/wan/vae
weights_dir: /scratch/project_465003416/lc_work/weights
