# res256/quad/full9/clip33: res256/quad/full9 continued on 33-frame clips at stride 2 under D4, 8 per update (1 per GCD), body 3e-6, io 3e-5, 1000 updates, bf16, adapter as loaded (shared scale) fixed: does longer temporal context cut the late-frame error
# Re-run: python scripts/wan/train_vae.py results/wan/vae/res256/quad/full9/clip33/config.yaml --name <new name>
name: res256/quad/full9/clip33
description: 'res256/quad/full9 continued on 33-frame clips at stride 2 under D4, 8 per update (1 per GCD), body 3e-6, io 3e-5, 1000 updates, bf16, adapter as loaded (shared scale) fixed: does longer temporal
  context cut the late-frame error'
vae: wan
data:
  h5_path: euler_mq_dataset/256x256_ds/train.h5
  test_h5: euler_mq_dataset/256x256_ds/test.h5
  stats_json: results/field_adapter/00_stats/eulermq_256_train_stats.json
  val_sims: 500
  split_seed: 42
  eval_sims: 100
  test_sims: 100
  test_every: 5
  test_gamma: null
  frames_per_sim: 33
  clip: true
  frame_stride: 2
  augment: true
  num_workers: 4
  latents: null
adapter:
  groups:
  - - density
    - momentum_x
    - momentum_y
    - pressure
loss:
  rmse: 1.0
  h1: 1.0
  latent: 0.0
  kind: rmse_h1
train:
  steps: 1000
  batch_sims: 8
  micro_batch: 1
  adapter_lr: 0.0
  vae_parts: all
  precision: mixed
  checkpointing: false
  vae_per_group: false
  vae_lr: 3.0e-06
  io_lr: 3.0e-05
  warmup_steps: 50
  lr_floor: 0.02
  max_grad_norm: 5.0
  eval_every: 250
  log_every: 10
  seed: 0
load: results/wan/vae/res256/quad/full9
results_dir: results/wan/vae
weights_dir: /scratch/project_465003416/lc_work/weights
