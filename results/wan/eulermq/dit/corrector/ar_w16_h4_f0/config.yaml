name: ar_w16_h4_f0
description: as ar_w16_h4 plus the true frame 0 as input at every step
model:
  history: 4
  first_frame: true
  channels:
  - 64
  - 128
  - 128
  - 256
  layers_per_block: 2
  precision: mixed
data:
  h5_path: euler_mq_dataset/256x256_ds/train.h5
  test_h5: euler_mq_dataset/256x256_ds/test.h5
  stats_json: results/field_adapter/00_stats/eulermq_256_train_stats.json
  val_sims: 500
  split_seed: 42
  eval_sims: 64
  test_sims: null
  test_every: 5
  test_gamma: null
  frames_per_sim: 2
  clip: false
  frame_stride: 2
  augment: true
  num_workers: 4
  latents: null
train:
  steps: 10000
  batch_sims: 16
  window: 16
  lr: 0.0002
  weight_decay: 0.01
  warmup_steps: 500
  lr_floor: 0.01
  max_grad_norm: 1.0
  eval_every: 1000
  log_every: 50
  seed: 0
rollouts:
- /scratch/project_465003416/lc_work/fields/stage3_d4_steps2_val500
