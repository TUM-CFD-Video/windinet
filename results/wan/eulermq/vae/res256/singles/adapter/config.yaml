# res256/singles/adapter: one field per image (rho | m_x | m_y | p), grayscale start; adapter alone on the frozen VAE, 2000 steps of 2 single frames under random D4 symmetries
# Re-run: python scripts/wan/train_vae.py results/wan/eulermq/vae/res256/singles/adapter/config.yaml --name <new name>
name: res256/singles/adapter
description: one field per image (rho | m_x | m_y | p), grayscale start; adapter alone on the frozen VAE, 2000 steps of 2 single frames under random D4 symmetries
vae: wan
data:
  h5_path: euler_mq_dataset/256x256_ds/train.h5
  test_h5: euler_mq_dataset/256x256_ds/test.h5
  stats_json: results/field_adapter/00_stats/eulermq_256_train_stats.json
  val_sims: 500
  split_seed: 42
  eval_sims: 100
  test_sims: 100
  test_every: 5
  test_gamma: null
  frames_per_sim: 2
  clip: false
  frame_stride: 1
  augment: true
  num_workers: 2
adapter:
  groups:
  - - density
  - - momentum_x
  - - momentum_y
  - - pressure
loss:
  rmse: 1.0
  h1: 1.0
train:
  steps: 2000
  batch_sims: 1
  micro_batch: 3
  adapter_lr: 0.003
  vae_parts: none
  vae_lr: 1.0e-06
  vae_per_group: false
  warmup_steps: 0
  lr_floor: 0.02
  max_grad_norm: 0.0
  eval_every: 500
  log_every: 10
  seed: 0
load: null
results_dir: results/wan/eulermq/vae
weights_dir: null
