# res256/singles/decoders: one field per image; one decoder per field (3e-6) behind the fixed singles adapter, 33-frame clips at frame stride 2 under random D4 symmetries, 8 clips per update over 8 GPUs, 2000 updates
# Re-run: python scripts/wan/train_vae.py results/wan/eulermq/vae/res256/singles/decoders/config.yaml --name <new name>
name: res256/singles/decoders
description: one field per image; one decoder per field (3e-6) behind the fixed singles adapter, 33-frame clips at frame stride 2 under random D4 symmetries, 8 clips per update over 8 GPUs, 2000 updates
vae: wan
data:
  h5_path: euler_mq_dataset/256x256_ds/train.h5
  test_h5: euler_mq_dataset/256x256_ds/test.h5
  stats_json: results/field_adapter/00_stats/eulermq_256_train_stats.json
  val_sims: 500
  split_seed: 42
  eval_sims: 100
  test_sims: 100
  test_every: 5
  test_gamma: null
  frames_per_sim: 33
  clip: true
  frame_stride: 2
  augment: true
  num_workers: 2
adapter:
  groups:
  - - density
  - - momentum_x
  - - momentum_y
  - - pressure
loss:
  rmse: 1.0
  h1: 1.0
train:
  steps: 2000
  batch_sims: 8
  micro_batch: 1
  adapter_lr: 0.0
  vae_parts: decoder
  vae_lr: 3.0e-06
  vae_per_group: true
  warmup_steps: 100
  lr_floor: 0.02
  max_grad_norm: 5.0
  eval_every: 200
  log_every: 10
  seed: 0
load: results/wan/eulermq/vae/res256/singles/adapter
results_dir: results/wan/eulermq/vae
weights_dir: /scratch/project_465003416/lc_work/weights
