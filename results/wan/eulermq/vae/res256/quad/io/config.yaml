# res256/quad/io: four fields in one widened Wan VAE pass: interface stage, the adapter mix (3e-3) and the widened in/out convolutions (1e-4) trained on the frozen VAE body, 5-frame clips at stride 2 under D4, 32 clips per update, 2000 updates, bf16 with fp32 io convs
# Re-run: python scripts/wan/train_vae.py results/wan/eulermq/vae/res256/quad/io/config.yaml --name <new name>
name: res256/quad/io
description: 'four fields in one widened Wan VAE pass: interface stage, the adapter mix (3e-3) and the widened in/out convolutions (1e-4) trained on the frozen VAE body, 5-frame clips at stride 2 under
  D4, 32 clips per update, 2000 updates, bf16 with fp32 io convs'
vae: wan
data:
  h5_path: euler_mq_dataset/256x256_ds/train.h5
  test_h5: euler_mq_dataset/256x256_ds/test.h5
  stats_json: results/field_adapter/00_stats/eulermq_256_train_stats.json
  val_sims: 500
  split_seed: 42
  eval_sims: 100
  test_sims: 100
  test_every: 5
  test_gamma: null
  frames_per_sim: 5
  clip: true
  frame_stride: 2
  augment: true
  num_workers: 4
  latents: null
adapter:
  groups:
  - - density
    - momentum_x
    - momentum_y
    - pressure
loss:
  rmse: 1.0
  h1: 1.0
  latent: 0.0
  kind: rmse_h1
train:
  steps: 2000
  batch_sims: 32
  micro_batch: 4
  adapter_lr: 0.003
  vae_parts: io
  precision: mixed
  checkpointing: false
  vae_per_group: false
  vae_lr: 1.0e-06
  io_lr: 0.0001
  warmup_steps: 100
  lr_floor: 0.02
  max_grad_norm: 5.0
  eval_every: 250
  log_every: 10
  seed: 0
load: null
results_dir: results/wan/eulermq/vae
weights_dir: /scratch/project_465003416/lc_work/weights
