# res512/pairs/2dec: (rho, p) + (m_x, m_y); per-image decoders continued from res256/pairs/2dec_clip33 on the native 512x512 data, 9-frame clips at frame stride 2 under random D4 symmetries, 8 clips per update over 8 GPUs, 1000 updates
# Re-run: python scripts/wan/train_vae.py results/wan/eulermq/vae/res512/pairs/2dec/config.yaml --name <new name>
name: res512/pairs/2dec
description: (rho, p) + (m_x, m_y); per-image decoders continued from res256/pairs/2dec_clip33 on the native 512x512 data, 9-frame clips at frame stride 2 under random D4 symmetries, 8 clips per update over 8
  GPUs, 1000 updates
vae: wan
data:
  h5_path: euler_mq_dataset/512x512_orig/train.h5
  test_h5: euler_mq_dataset/512x512_orig/test.h5
  stats_json: results/field_adapter/00_stats/eulermq_256_test_stats.json
  val_sims: 500
  split_seed: 42
  eval_sims: 50
  test_sims: 100
  test_every: 5
  test_gamma: null
  frames_per_sim: 9
  clip: true
  frame_stride: 2
  augment: true
  num_workers: 2
adapter:
  groups:
  - - density
    - pressure
  - - momentum_x
    - momentum_y
loss:
  rmse: 1.0
  h1: 1.0
train:
  steps: 1000
  batch_sims: 8
  micro_batch: 1
  adapter_lr: 0.0
  vae_parts: decoder
  vae_lr: 3.0e-06
  vae_per_group: true
  warmup_steps: 100
  lr_floor: 0.02
  max_grad_norm: 5.0
  eval_every: 200
  log_every: 10
  seed: 0
load: results/wan/eulermq/vae/res256/pairs/2dec_clip33
results_dir: results/wan/eulermq/vae
weights_dir: /scratch/project_465003416/lc_work/weights
