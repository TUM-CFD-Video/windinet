# lrsweep_all_noadapter_1e-5: Peak-lr sweep, full VAE, untrained adapter, 30 updates on frames: peak 1e-5; section 7
# Re-run: python scripts/wan/train_vae.py results/field_adapter/20_wan_roundtrip/lrsweep_all_noadapter_1e-5/config.yaml --name <new name>
name: lrsweep_all_noadapter_1e-5
description: 'Peak-lr sweep, full VAE, untrained adapter, 30 updates on frames: peak 1e-5; section 7'
vae: wan
data:
  h5_path: euler_mq_dataset/256x256_ds/test.h5
  stats_json: results/field_adapter/00_stats/eulermq_256_test_stats.json
  test_every: 5
  test_gamma: null
  frames_per_sim: 2
  clip: false
  num_workers: 2
adapter:
  groups:
  - - density
    - pressure
  - - momentum_x
    - momentum_y
  load: results/field_adapter/20_wan_roundtrip/wan_ft_decoder_noadapter/adapter.pt
loss:
  rmse: 1.0
  h1: 1.0
train:
  steps: 30
  batch_sims: 8
  lr: 0.0
  vae_parts: all
  vae_lr: 1.0e-05
  vae_load: null
  warmup_steps: 3
  lr_floor: 0.02
  max_grad_norm: 5.0
  eval_every: 10
  seed: 0
ref_stats: results/field_adapter/30_reference/wan_ref_stats.pt
