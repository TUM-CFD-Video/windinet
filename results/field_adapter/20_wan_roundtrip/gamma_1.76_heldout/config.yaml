# gamma_1.76_heldout: Adapter trained with gamma 1.76 (the stiffest gas) held out: extrapolation across gamma; section 8
# Re-run: python scripts/wan/train_vae.py results/field_adapter/20_wan_roundtrip/gamma_1.76_heldout/config.yaml --name <new name>
name: gamma_1.76_heldout
description: 'Adapter trained with gamma 1.76 (the stiffest gas) held out: extrapolation across gamma; section 8'
vae: wan
data:
  h5_path: euler_mq_dataset/256x256_ds/test.h5
  stats_json: results/field_adapter/00_stats/eulermq_256_test_stats.json
  test_every: 5
  test_gamma: 1.76
  frames_per_sim: 2
  clip: false
  num_workers: 2
adapter:
  groups:
  - - density
    - pressure
  - - momentum_x
    - momentum_y
loss:
  rmse: 1.0
  h1: 1.0
train:
  steps: 600
  batch_sims: 1
  lr: 0.003
  vae_parts: none
  vae_lr: 5.0e-05
  warmup_steps: 0
  lr_floor: 0.02
  max_grad_norm: 0.0
  eval_every: 300
  seed: 0
