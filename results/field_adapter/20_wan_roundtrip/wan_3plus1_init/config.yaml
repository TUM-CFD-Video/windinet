# wan_3plus1_init: Grouping (density, momentum_x, momentum_y) + (pressure), z-score init, untrained; section 3
# Re-run: python scripts/field_adapter/train_adapter.py results/field_adapter/20_wan_roundtrip/wan_3plus1_init/config.yaml --name <new name>
name: wan_3plus1_init
description: Grouping (density, momentum_x, momentum_y) + (pressure), z-score init, untrained; section 3
vae: wan
data:
  h5_path: euler_mq_dataset/256x256_ds/test.h5
  stats_json: results/field_adapter/00_stats/eulermq_256_test_stats.json
  test_every: 5
  frames_per_sim: 2
  num_workers: 2
adapter:
  groups:
  - - density
    - momentum_x
    - momentum_y
  - - pressure
  load: null
loss:
  rmse: 1.0
  h1: 1.0
train:
  steps: 0
  batch_sims: 1
  lr: 0.003
  vae_parts: none
  vae_lr: 5.0e-05
  warmup_steps: 0
  lr_floor: 0.02
  max_grad_norm: 0.0
  eval_every: 300
  seed: 0
ref_stats: results/field_adapter/30_reference/wan_ref_stats.pt
