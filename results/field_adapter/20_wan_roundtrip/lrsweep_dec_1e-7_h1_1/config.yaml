# lrsweep_dec_1e-7_h1_1: Peak-lr sweep, decoder only, peak 1e-7 with H1 weight 1 instead of 50; section 7
# Re-run: python scripts/field_adapter/train_adapter.py results/field_adapter/20_wan_roundtrip/lrsweep_dec_1e-7_h1_1/config.yaml --name <new name>
name: lrsweep_dec_1e-7_h1_1
description: Peak-lr sweep, decoder only, peak 1e-7 with H1 weight 1 instead of 50; section 7
vae: wan
data:
  h5_path: euler_mq_dataset/256x256_ds/test.h5
  stats_json: results/field_adapter/00_stats/eulermq_256_test_stats.json
  test_every: 5
  frames_per_sim: 2
  num_workers: 2
adapter:
  groups:
  - - density
    - pressure
  - - momentum_x
    - momentum_y
  load: results/field_adapter/20_wan_roundtrip/wan_pairs_h1_50/adapter.pt
loss:
  rmse: 1.0
  h1: 1.0
train:
  steps: 15
  batch_sims: 4
  lr: 0.0
  vae_parts: decoder
  vae_lr: 1.0e-07
  warmup_steps: 2
  lr_floor: 0.02
  max_grad_norm: 5.0
  eval_every: 15
  seed: 0
ref_stats: results/field_adapter/30_reference/wan_ref_stats.pt
