# wan_ft_joint_pairs2000: Joint polish after wan_ft_decoder_pairs2000: adapter at lr 1e-4 and decoder at 1e-6; section 7
# Re-run: python scripts/wan/train_vae.py results/field_adapter/20_wan_roundtrip/wan_ft_joint_pairs2000/config.yaml --name <new name>
name: wan_ft_joint_pairs2000
description: 'Joint polish after wan_ft_decoder_pairs2000: adapter at lr 1e-4 and decoder at 1e-6; section 7'
vae: wan
data:
  h5_path: euler_mq_dataset/256x256_ds/test.h5
  stats_json: results/field_adapter/00_stats/eulermq_256_test_stats.json
  test_every: 5
  test_gamma: null
  frames_per_sim: 5
  clip: true
  num_workers: 2
adapter:
  groups:
  - - density
    - pressure
  - - momentum_x
    - momentum_y
loss:
  rmse: 1.0
  h1: 1.0
train:
  steps: 120
  batch_sims: 3
  lr: 0.0001
  vae_parts: decoder
  vae_lr: 1.0e-06
  warmup_steps: 12
  lr_floor: 0.02
  max_grad_norm: 5.0
  eval_every: 20
  seed: 0
ref_stats: results/field_adapter/30_reference/wan_ref_stats.pt
load: results/field_adapter/20_wan_roundtrip/wan_ft_decoder_pairs2000
